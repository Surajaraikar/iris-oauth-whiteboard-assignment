[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-oauth-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.5", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13", "httpx>=0.27", "cryptography>=43", "itsdangerous>=2.2", "python-multipart>=0.0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "asgi-lifespan>=2", "ruff>=0.7", "mypy>=1.12"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependency injection uses Depends in parameter defaults.
